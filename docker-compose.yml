services:
  fitnesscenter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kadir-fitness-center
    ports:
      - "5253:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/FitnessCenter.db
    volumes:
      - fitnesscenter_data:/app/data
    restart: unless-stopped

volumes:
  fitnesscenter_data:
